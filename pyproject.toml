[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistic-smith"
version = "0.1.0"
description = "Offline desktop statistics and graphing for large datasets (StatCrunch-style UI, reproducible .do/.R/.py scripts)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.6", "duckdb>=1.0", "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "statsmodels>=0.14", "matplotlib>=3.8",
  "polars>=1.0", "fastexcel>=0.11", "pyarrow>=15", "pyreadstat>=1.2", "pyreadr>=0.5", "psutil>=5.9", "threadpoolctl>=3.2", "xlsxwriter>=3.1",
]

[project.scripts]
statistic-smith = "statsmith.__main__:main"

[tool.setuptools.packages.find]
include = ["statsmith*"]

[tool.setuptools.package-data]
statsmith = ["data/geo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
